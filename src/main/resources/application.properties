spring.application.name=MagicFridgeAI


#CONFIGURA플O DO H2
spring.datasource.url=${DATABASE_URL}
spring.h2.console.path= /magicFridge-database
spring.datasource.driver=org.h2.Driver
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

#CONFIGURA플O DO JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.h2.console.enabled=true

#CONFIGURA플O DO FLYWAY
spring.flyway.enable=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

#CONFIGURA플O DA CHAVE API
gemini-api-url=https://generativelanguage.googleapis.com/v1beta/interactions
gemini-api-key=${APIKEY_GEMINI}




